version: "3.9"

# ================================================================
# Cache Service - Local Development Stack
# Includes: cache-service + Redis standalone
# Usage: docker compose up -d
# ================================================================

services:
  # ----------------------------------------------------------------
  # Cache Service Application
  # ----------------------------------------------------------------
  cache-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cache-service:local
    container_name: cache-service
    ports:
      - "8080:8080"   # API
      - "8081:8081"   # Actuator / Metrics
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 0
      CACHE_NAMESPACE: cache-service
      CACHE_DEFAULT_TTL: 3600
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cache-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ----------------------------------------------------------------
  # Redis Standalone (Development)
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cache-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/standalone.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - cache-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------
  # Redis Commander (Web UI for development)
  # Access at: http://localhost:8082
  # ----------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cache-service-redis-commander
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - cache-net
    profiles:
      - tools    # Only start with: docker compose --profile tools up

volumes:
  redis-data:
    driver: local

networks:
  cache-net:
    driver: bridge

version: "3.9"

# ================================================================
# Cache Service - High Availability Stack with Redis Sentinel
# Topology: 1 master + 2 replicas + 3 sentinels
# Usage: docker compose -f docker-compose-sentinel.yml up -d
# ================================================================

services:
  # ----------------------------------------------------------------
  # Cache Service Application
  # ----------------------------------------------------------------
  cache-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cache-service:local
    container_name: cache-service-sentinel
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: sentinel
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: "sentinel-1:26379,sentinel-2:26379,sentinel-3:26379"
      REDIS_PASSWORD: ""
      CACHE_NAMESPACE: cache-service
      LOG_LEVEL: INFO
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    networks:
      - sentinel-net
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Redis Master
  # ----------------------------------------------------------------
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - master-data:/data
      - ./docker/redis/standalone.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - sentinel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Redis Replicas
  # ----------------------------------------------------------------
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    volumes:
      - replica1-data:/data
    command: redis-server --replicaof redis-master 6379 --replica-read-only yes
    depends_on:
      - redis-master
    networks:
      - sentinel-net
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    volumes:
      - replica2-data:/data
    command: redis-server --replicaof redis-master 6379 --replica-read-only yes
    depends_on:
      - redis-master
    networks:
      - sentinel-net
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Redis Sentinels (minimum 3 for quorum = 2)
  # ----------------------------------------------------------------
  sentinel-1:
    image: redis:7-alpine
    container_name: sentinel-1
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
    command: sh -c "cp /tmp/sentinel.conf /sentinel.conf && redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - sentinel-net
    restart: unless-stopped

  sentinel-2:
    image: redis:7-alpine
    container_name: sentinel-2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
    command: sh -c "cp /tmp/sentinel.conf /sentinel.conf && redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - sentinel-net
    restart: unless-stopped

  sentinel-3:
    image: redis:7-alpine
    container_name: sentinel-3
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
    command: sh -c "cp /tmp/sentinel.conf /sentinel.conf && redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
    networks:
      - sentinel-net
    restart: unless-stopped

volumes:
  master-data:
  replica1-data:
  replica2-data:

networks:
  sentinel-net:
    driver: bridge

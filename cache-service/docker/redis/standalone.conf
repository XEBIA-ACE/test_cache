# ================================================================
# Redis Standalone Configuration
# Used for: local development, Docker Compose, unit testing
# ================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Authentication (empty = no auth for development)
# requirepass yourpassword

# Persistence - disabled for development speed
save ""
appendonly no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Performance
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Logging
loglevel notice
logfile ""

# Slow log (commands taking > 10ms are logged)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Connections
maxclients 100
tcp-keepalive 300
timeout 0

# Lua scripting timeout (used by Redisson locks)
lua-time-limit 5000

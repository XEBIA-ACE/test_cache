# ================================================================
# Redis Sentinel Configuration
# Monitors the "mymaster" Redis instance for automatic failover.
#
# Quorum: 2 (majority of 3 sentinels must agree for failover)
# ================================================================

# Sentinel listen port
port 26379
bind 0.0.0.0

# Monitor the master: sentinel monitor <name> <host> <port> <quorum>
# Quorum = minimum sentinels that must agree on a failover
sentinel monitor mymaster redis-master 6379 2

# How long (ms) master must be unreachable before considered DOWN
sentinel down-after-milliseconds mymaster 5000

# How long (ms) for a failover to complete before another sentinel tries
sentinel failover-timeout mymaster 60000

# How many replicas can be reconfigured simultaneously during failover
sentinel parallel-syncs mymaster 1

# Reconnect interval to master (ms)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Logging
loglevel notice
logfile ""

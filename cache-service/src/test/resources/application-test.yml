##############################################################################
# Cache Service – Test Profile
# Redis host/port are overridden programmatically by Testcontainers.
##############################################################################
spring:
  redis:
    mode: standalone
    host: localhost
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 4
        max-idle: 2
        min-idle: 0

logging:
  level:
    com.example.cacheservice: DEBUG
    org.springframework.data.redis: DEBUG

spring:
  profiles:
    active: standalone

cache:
  redis:
    mode: standalone
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000
    pool:
      max-active: 4
      max-idle: 2
      min-idle: 1
      max-wait: 500

  settings:
    default-ttl: 60
    max-key-length: 512
    max-value-size: 1048576
    namespace: test

  lock:
    default-wait-time: 1000
    default-lease-time: 5000

logging:
  level:
    com.example.cacheservice: DEBUG
    io.lettuce: WARN
    org.redisson: WARN

##############################################################################
# Cache Service – Staging Profile
#
# Mirrors production topology. Redis Sentinel is used for HA.
# Secrets are injected via environment variables or a secret manager.
##############################################################################

spring:
  redis:
    mode: sentinel
    password: ${REDIS_PASSWORD}
    database: 0
    sentinel:
      master: ${REDIS_SENTINEL_MASTER:mymaster}
      nodes: ${REDIS_SENTINEL_NODES}
      password: ${REDIS_SENTINEL_PASSWORD:}
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 5000

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.cacheservice: INFO
    org.springframework.data.redis: WARN

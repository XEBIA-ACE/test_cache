server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: cache-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Jackson configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ----------------------------------------------------------------
# Management / Actuator
# ----------------------------------------------------------------
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: false  # We use our own custom health indicator

# ----------------------------------------------------------------
# OpenAPI / Swagger
# ----------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ----------------------------------------------------------------
# Cache Service Application Properties
# ----------------------------------------------------------------
cache:
  redis:
    # Overridden by profile-specific config
    mode: ${SPRING_PROFILES_ACTIVE:standalone}
    timeout: ${REDIS_TIMEOUT:2000}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

    pool:
      max-active: ${REDIS_POOL_MAX_ACTIVE:16}
      max-idle: ${REDIS_POOL_MAX_IDLE:8}
      min-idle: ${REDIS_POOL_MIN_IDLE:2}
      max-wait: ${REDIS_POOL_MAX_WAIT:1000}

  settings:
    default-ttl: ${CACHE_DEFAULT_TTL:3600}
    max-key-length: ${CACHE_MAX_KEY_LENGTH:512}
    max-value-size: ${CACHE_MAX_VALUE_SIZE:1048576}
    namespace: ${CACHE_NAMESPACE:cache-service}

  lock:
    default-wait-time: ${LOCK_DEFAULT_WAIT_TIME:5000}
    default-lease-time: ${LOCK_DEFAULT_LEASE_TIME:30000}

# ----------------------------------------------------------------
# Logging
# ----------------------------------------------------------------
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.cacheservice: DEBUG
    io.lettuce: WARN
    org.redisson: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
